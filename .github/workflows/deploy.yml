name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch: # lets you re-deploy by hand from the Actions tab

permissions:
  contents: read
  pages: write
  id-token: write # deploy-pages authenticates over OIDC and fails without this

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # the resume freshness check below reads git history
      - name: Resume PDF is up to date
        run: |
          tex=$(git log -1 --format=%ct -- resume/main.tex)
          pdf=$(git log -1 --format=%ct -- public/resume.pdf)
          if [ -z "$tex" ] || [ -z "$pdf" ]; then
            echo "Could not read commit times for resume/main.tex or public/resume.pdf."
            echo "Both must be tracked, and checkout needs fetch-depth: 0."
            exit 1
          fi
          if [ "$tex" -gt "$pdf" ]; then
            echo "resume/main.tex changed after public/resume.pdf was last rebuilt."
            echo "Run 'bun run resume' and commit the PDF."
            exit 1
          fi
      - uses: oven-sh/setup-bun@v2.2.0
      - run: bun install --frozen-lockfile
      - run: bun run format:check
      - run: bun run check
      - run: bun run build
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
